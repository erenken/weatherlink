name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.2'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Require a stable release version
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Main must publish a stable major.minor.patch version; GitVersion returned '$VERSION'."
            exit 1
          fi

      - name: Install dependencies
        run: dotnet restore myNOC.WeatherLink.sln --warnaserror

      - name: Build
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          ASSEMBLY_VERSION: ${{ steps.gitversion.outputs.assemblySemVer }}
          FILE_VERSION: ${{ steps.gitversion.outputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ steps.gitversion.outputs.informationalVersion }}
        run: >-
          dotnet build myNOC.WeatherLink.sln --configuration Release --no-restore --warnaserror
          -p:Version="$VERSION" -p:AssemblyVersion="$ASSEMBLY_VERSION"
          -p:FileVersion="$FILE_VERSION" -p:InformationalVersion="$INFORMATIONAL_VERSION"
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:PackageVersion="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test myNOC.WeatherLink.sln --configuration Release --no-build --no-restore
          --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Pack NuGet
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: >-
          dotnet pack src/myNOC.WeatherLink/myNOC.WeatherLink.csproj
          --configuration Release --no-build --no-restore --warnaserror --include-symbols
          --output .pack -p:PackageVersion="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Validate packaged Source Link
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install sourcelink --tool-path "$RUNNER_TEMP/sourcelink" --version 3.1.1
          unzip -q ".pack/myNOC.WeatherLink.$VERSION.snupkg" -d "$RUNNER_TEMP/sourcelink-symbols"
          for framework in net8.0 net10.0; do
            "$RUNNER_TEMP/sourcelink/sourcelink" test "$RUNNER_TEMP/sourcelink-symbols/lib/$framework/myNOC.WeatherLink.pdb"
          done

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet package and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push ".pack/*.nupkg" --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" .pack/*.nupkg .pack/*.snupkg \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
